# Builds the website image, pushes it to GHCR and triggers the Coolify deploy.
#
# Requires these secrets in the Production environment (Settings -> Environments
# -> Production). The environment only allows the main branch, so branch and PR
# workflows can't read them.
#   GHCR_PUSH_TOKEN      classic PAT with write:packages. GHCR pushes use this,
#                        not GITHUB_TOKEN, so that only main can publish the
#                        images Coolify deploys (the repo's own Actions access
#                        to the package is read-only).
#   MONGODB_URI          passed as a BuildKit secret (static pages read the DB)
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
#   NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN
#   NEXT_PUBLIC_POSTHOG_HOST
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_URL
#   COOLIFY_WEBSITE_WEBHOOK_URL
#   COOLIFY_API_TOKEN
#
# NEXT_PUBLIC_ values end up in the client bundle (public by design). Runtime
# secrets (Clerk secret key, Resend, Stripe, R2, …) are Coolify runtime env
# vars and are never baked into the image.

name: Build and Push Website Image

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile.website"
      - "docker-compose.website.yml"
      - ".dockerignore"
      - ".github/workflows/docker-build-push-website.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Secrets live in the Production environment, which only main can use.
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.website
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          secrets: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=/sign-up
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/
            NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}

      - name: Trigger Coolify deploy
        run: |
          curl -f -sS -X GET "${{ secrets.COOLIFY_WEBSITE_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
