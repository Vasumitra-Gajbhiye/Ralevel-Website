# Save as: .github/workflows/docker-build-push-website.yml
#
# Requires these repo secrets (Settings -> Secrets and variables -> Actions):
#   MONGODB_URI
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
#   NEXT_PUBLIC_CLERK_SIGN_IN_URL
#   NEXT_PUBLIC_CLERK_SIGN_UP_URL
#   NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL
#   NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL
#   NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
#   NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN
#   NEXT_PUBLIC_POSTHOG_HOST
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   NEXT_PUBLIC_URL
#   COOLIFY_WEBSITE_WEBHOOK_URL
#   COOLIFY_API_TOKEN
#   COOLIFY_BOT_WEBHOOK_URL
#
# Note: everything prefixed NEXT_PUBLIC_ ends up embedded in the client bundle
# and is visible to anyone who views your site's source - that's normal for
# Next.js public env vars, not a leak. MONGODB_URI is NOT public - it's only
# used at build time here (per your Dockerfile) and should never be a
# NEXT_PUBLIC_ var. Confirm build time is genuinely the only place it's needed;
# if it's also used at runtime, it needs to be injected into the running
# container via Coolify's runtime env vars instead, not baked into the image.

name: Build and Push Website Image

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "packages/**"
      - ".github/workflows/docker-build-push-website.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/website

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/website/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          build-args: |
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}
            NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL }}
            NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_URL }}

      - name: Trigger Coolify deploy
        run: |
          curl -X GET "${{ secrets.COOLIFY_WEBSITE_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
