# Builds the bot image, pushes it to GHCR and triggers the Coolify deploy.
#
# Requires these secrets in the Production environment (main only):
#   GHCR_PUSH_TOKEN          classic PAT with write:packages (see the website
#                            workflow for why GITHUB_TOKEN isn't used to push)
#   COOLIFY_BOT_WEBHOOK_URL
#   COOLIFY_API_TOKEN

name: Build and Push Bot Image

on:
  push:
    branches: [main]
    paths:
      - "apps/bot/**"
      - "packages/discord/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Dockerfile.bot"
      - "docker-compose.bot.yml"
      - ".dockerignore"
      - ".github/workflows/docker-build-push-bot.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Secrets live in the Production environment, which only main can use.
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.bot
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=bot
          cache-to: type=gha,mode=max,scope=bot

      - name: Trigger Coolify deploy
        run: |
          curl -f -sS -X GET "${{ secrets.COOLIFY_BOT_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"
